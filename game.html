<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D2521">
<style>:root{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bonnet Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky garage HUD with a hazard-tape edge over one working column; from 900px the job splits into ticket + diagnosis | car on the ramp + parts. Fixed tab bar at the foot. */
:root{
  --floor:#DADFD9; --panel:#F3F5F1; --panel-2:#E6EAE4; --ink:#17201B; --muted:#56635C; --line:#B6BFB8;
  --hazard:#F2B705; --hazard-ink:#15130B;
  --ticket:#EADCAE; --ticket-ink:#2C2513; --ticket-line:#B19D66;
  --bay:#C8CFC8; --bay-deep:#38423C; --car-line:#16201B; --glass:#9DB1BC; --tyre:#262B28; --steel:#87928B; --lamp:#F7F3D6;
  --good:#2C7A4B; --worn:#B95F10; --bad:#BC362A; --on-sem:#FFFFFF;
  --hud-bg:#1D2521; --hud-fg:#EEF2EE; --hud-muted:#97A59D; --hud-track:rgba(255,255,255,.14); --hud-bad:#F48174;
  --scrim:rgba(12,16,14,.58); --shade:rgba(0,0,0,.10); --steel-ui:#7F8984; --blue:#2F6DB3; --hud-good:#7BD69B;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --floor:#111614; --panel:#1B221F; --panel-2:#242C28; --ink:#E2E8E3; --muted:#93A098; --line:#35413B;
    --hazard:#F5C024; --hazard-ink:#15130B;
    --ticket:#2D2919; --ticket-ink:#EADCAE; --ticket-line:#5E5334;
    --bay:#171E1B; --bay-deep:#0A0E0C; --car-line:#AEB9B2; --glass:#4A6070; --tyre:#08090A; --steel:#68746D; --lamp:#F7F3D6;
    --good:#5CBF84; --worn:#EC9541; --bad:#F06C5E; --on-sem:#0F1311;
    --hud-bg:#0A0E0C; --scrim:rgba(0,0,0,.66); --shade:rgba(0,0,0,.18); --steel-ui:#8C9791;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --floor:#111614; --panel:#1B221F; --panel-2:#242C28; --ink:#E2E8E3; --muted:#93A098; --line:#35413B;
  --hazard:#F5C024; --hazard-ink:#15130B;
  --ticket:#2D2919; --ticket-ink:#EADCAE; --ticket-line:#5E5334;
  --bay:#171E1B; --bay-deep:#0A0E0C; --car-line:#AEB9B2; --glass:#4A6070; --tyre:#08090A; --steel:#68746D; --lamp:#F7F3D6;
  --good:#5CBF84; --worn:#EC9541; --bad:#F06C5E; --on-sem:#0F1311;
  --hud-bg:#0A0E0C; --scrim:rgba(0,0,0,.66); --shade:rgba(0,0,0,.18); --steel-ui:#8C9791;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--floor);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,blockquote,dl,dd{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}
.label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* HUD */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud-bg)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--hud-bg);color:var(--hud-fg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 9px,var(--hazard-ink) 9px 18px)}
.hud-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
.brand{font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--hazard)}
.stats{flex:1 1 300px;display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr;gap:6px}
.stat{min-width:0;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--hud-muted);white-space:nowrap}
.stat .v{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v.neg{color:var(--hud-bad)}
.stat .v.warn{color:var(--hazard)}
.xp{display:block;height:4px;background:var(--hud-track);border-radius:2px;overflow:hidden;margin-top:2px;max-width:80px}
.xp i{display:block;height:100%;background:var(--hazard);width:0;transition:width .4s}

/* Shell */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px calc(104px + env(safe-area-inset-bottom,0px))}
/* the page itself never scrolls; the main area does, so lists scroll even inside a locked full-screen frame */
html{height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.hud{flex:none}
main{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:1100px;margin:0 auto}
.view{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:15px;cursor:pointer;text-align:center;line-height:1.15}
.btn.primary{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn.ghost{border-color:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0 6px;font-weight:600}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{position:relative;background:none;border:0;min-height:60px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);cursor:pointer}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;background:var(--hazard)}
.badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-sem);font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* Welcome */
.welcome{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:18px;display:grid;gap:12px}
.welcome h2{font-family:var(--font-display);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;text-wrap:balance}
.welcome ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:step}
.welcome li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;max-width:68ch}
.welcome li::before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--hazard);color:var(--hazard-ink);font-family:var(--font-display);font-weight:900;font-size:18px}
.welcome li b{display:block}
.welcome .btn{justify-self:start}

/* Workshop layout */
.ws{display:grid;gap:16px}
.ws-left,.ws-right{display:grid;gap:16px;min-width:0;align-content:start}
@media (min-width:900px){.ws{grid-template-columns:minmax(0,390px) minmax(0,1fr);align-items:start}}

.baytabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.baytab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;min-width:0}
.baytab b{font-family:var(--font-display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1}
.baytab span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.baytab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--hazard)}

/* Job ticket */
.ticket{position:relative;background:var(--ticket);color:var(--ticket-ink);border-radius:4px 10px 10px 4px;padding:14px 16px 16px 32px;display:grid;gap:9px;min-width:0}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;border-right:1.5px dashed var(--ticket-line);background:radial-gradient(circle at 8px 50%,var(--floor) 3.6px,transparent 4.3px) 0 0/18px 16px repeat-y}
.t-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.t-due.late{color:var(--bad)}
.t-title{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.t-quote{font-style:italic;font-weight:500;font-size:16.5px;line-height:1.35;max-width:60ch}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.t-cust{font-weight:700}
.t-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;border-top:1.5px dashed var(--ticket-line);padding-top:10px}
.t-facts .wide{grid-column:1/-1}
.t-facts dt{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.72}
.t-facts dd{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.diff{display:inline-flex;gap:3px;vertical-align:middle}
.diff i{width:14px;height:8px;border-radius:2px;border:1.5px solid currentColor;opacity:.5}
.diff i.on{background:currentColor;opacity:1}

.plate{display:inline-flex;align-items:stretch;background:#F6CE1C;color:#111;border:1.5px solid #111;border-radius:4px;overflow:hidden;font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:.08em;line-height:1;white-space:nowrap}
.plate .uk{background:#1F4FA0;color:#FFF;font-size:7.5px;letter-spacing:.04em;padding:0 3px 3px;display:flex;align-items:flex-end}
.plate .num{padding:5px 8px}

/* Tools */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:80px;padding:11px 11px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;min-width:0}
.tool svg{width:24px;height:24px;margin-bottom:2px}
.tool-name{font-weight:700;font-size:14.5px;line-height:1.15}
.tool-time{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);line-height:1.25}
.tool:hover:not(:disabled){border-color:var(--ink)}
.tool:disabled{opacity:.5;cursor:not-allowed}
.tool.locked{background:transparent;border-style:dashed}

/* Notes */
.notes{background:var(--panel);border-radius:10px;padding:14px 16px}
.notes ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:11px}
.notes li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:1px 10px}
.notes time{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:1px;grid-row:span 2}
.notes .src{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.notes p{line-height:1.4}
.notes code{font-family:var(--font-mono);font-weight:600;font-size:13px;background:var(--panel-2);border-radius:3px;padding:1px 5px;margin-right:4px}
.notes .empty{margin-top:6px;color:var(--muted)}

/* Bay */
.bay{position:relative;background:var(--bay);border-radius:12px;padding:10px 6px 6px;overflow:hidden;display:grid;place-items:center}
.bay::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(50% - 134px),var(--hazard) calc(50% - 134px),var(--hazard) calc(50% - 127px),transparent calc(50% - 127px),transparent calc(50% + 127px),var(--hazard) calc(50% + 127px),var(--hazard) calc(50% + 134px),transparent calc(50% + 134px));opacity:.85}
.bay-mark{position:absolute;left:10px;top:10px;font-family:var(--font-display);font-weight:900;font-size:40px;line-height:.85;text-transform:uppercase;color:var(--ink);opacity:.1;writing-mode:vertical-rl;transform:rotate(180deg);pointer-events:none}
.bay svg{position:relative;display:block;width:100%;max-width:272px;height:auto}
.car-arrive{animation:arrive .6s cubic-bezier(.2,.8,.2,1)}
@keyframes arrive{from{transform:translateY(-34px);opacity:.35}}
.bay-empty{min-height:300px;padding:28px 20px}
.empty-in{position:relative;display:grid;gap:10px;justify-items:center;text-align:center;max-width:300px}
.empty-in h2{font-family:var(--font-display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.empty-in .row{justify-content:center}

/* SVG car */
.c-ramp rect{fill:var(--steel)}
.c-ramp path{stroke:var(--steel);stroke-width:4;stroke-linecap:round;fill:none}
.c-front{font-family:var(--font-body);font-size:9px;font-weight:700;letter-spacing:.28em;fill:var(--muted);text-anchor:middle}
.c-body,.c-mirror{stroke:var(--car-line);stroke-width:1.5}
.xray .c-body{fill-opacity:.38}
.c-shade{fill:var(--shade)}
.c-glass{fill:var(--glass);stroke:var(--car-line);stroke-width:1}
.c-lamp{fill:var(--lamp);stroke:var(--car-line);stroke-width:.8}
.c-tail{fill:var(--bad)}
.c-crease{stroke:var(--car-line);stroke-opacity:.3;stroke-width:1.2;fill:none}
.c-tyre{fill:var(--tyre);stroke:var(--car-line);stroke-width:1}
.c-tread{stroke:var(--steel);stroke-width:1.2;opacity:.65}
.c-gone{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.c-hub{fill:var(--steel);stroke:var(--car-line);stroke-width:1}
.c-bay{fill:var(--bay-deep)}
.c-block{fill:var(--steel)}
.c-cover{fill:var(--tyre);stroke:var(--steel);stroke-width:1}
.c-rib{stroke:var(--steel);stroke-width:1;opacity:.6;fill:none}
.c-coil{fill:var(--tyre);stroke:var(--lamp);stroke-width:.8}
.c-plug{fill:var(--lamp)}
.c-hole{fill:var(--bay-deep)}
.c-batt{fill:var(--tyre);stroke:var(--steel);stroke-width:1}
.c-term{stroke:var(--bad);stroke-width:2;fill:none}
.c-rad{fill:var(--steel);opacity:.85}
.c-belt{fill:none;stroke:var(--tyre);stroke-width:2.5}
.c-alt{fill:var(--steel);stroke:var(--tyre);stroke-width:1.2}
.c-airbox{fill:var(--panel-2);stroke:var(--steel);stroke-width:1}
.c-therm,.c-oil{fill:var(--hazard);stroke:var(--tyre);stroke-width:1}
.c-gonepart{fill:none!important;stroke:var(--bad)!important;stroke-dasharray:3 2;stroke-width:1.3!important;opacity:1!important}
.c-under{opacity:.42}
.c-under.on{opacity:1}
.c-pipe{fill:none;stroke:var(--steel);stroke-width:4;stroke-linecap:round}
.c-under:not(.on) .c-pipe{stroke-dasharray:5 4}
.c-cat,.c-sil{fill:var(--steel);stroke:var(--car-line);stroke-width:1}
.c-lambda{fill:var(--lamp);stroke:var(--car-line);stroke-width:1}
.c-hit{fill:transparent;stroke:none;cursor:pointer;pointer-events:all}
.c-hit:hover{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.c-hit.sel{stroke:var(--hazard);stroke-width:2.6;stroke-dasharray:7 4}
.c-mk{pointer-events:none}
.c-mk circle{stroke:var(--bay);stroke-width:2}
.c-mk.bad circle{fill:var(--bad)}
.c-mk.worn circle{fill:var(--worn)}
.c-mk.good circle{fill:var(--good)}
.c-mk text{fill:var(--on-sem);font-family:var(--font-body);font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.c-mk path{fill:none;stroke:var(--on-sem);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 3D stage */
.bay3d{display:block;padding:0}
.bay3d::before{display:none}
.bay3d .bay-mark{z-index:1}
.stage{position:relative;width:100%;height:clamp(300px,84vw,440px)}
@media (min-width:900px){.stage{height:440px}}
.stage-canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.stage-canvas:active{cursor:grabbing}
.stage-ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stage-ui>*{pointer-events:auto}
.stage-btn{position:absolute;top:10px;right:10px;min-height:34px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.stage-hint{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:999px;pointer-events:none!important}
.mk{position:absolute;left:0;top:0;width:0;height:0;padding:0;border:0;background:none;cursor:pointer}
.mk-dot{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.mk-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.mk.bad .mk-dot{background:var(--bad);color:var(--on-sem)}
.mk.worn .mk-dot{background:var(--worn);color:var(--on-sem)}
.mk.good .mk-dot{background:var(--good);color:var(--on-sem)}
.mk.sel .mk-dot{outline:3px solid var(--hazard);outline-offset:2px}
.mk:focus-visible{outline:none}
.mk:focus-visible .mk-dot{outline:3px solid var(--ink);outline-offset:2px}
.mk-label{position:absolute;left:19px;top:-12px;height:24px;display:none;align-items:center;padding:0 9px;border-radius:6px;background:var(--hud-bg);color:var(--hud-fg);font-size:12px;font-weight:700;white-space:nowrap}
.mk.flip .mk-label{left:auto;right:19px}
.mk.sel .mk-label{display:flex}
.mk.door .mk-dot{background:var(--hazard);color:var(--hazard-ink,#16191A);border-color:#16191A}
.mk.door .mk-label{display:flex}

/* Immersive 3D workshop */
body.immersive{overflow:hidden}
body.immersive main{padding:0;overflow:hidden}
body.immersive .wrap{max-width:none}
body.immersive .view{gap:0}
body.immersive #toast{bottom:auto;top:calc(var(--hud-h,64px) + 64px)}
.ws3d{position:relative;height:var(--stage-h,70vh);overflow:hidden;background:var(--bay)}
.bay-slot{position:absolute;inset:0}
.ws3d .stage{height:100%}
.ws3d .stage-canvas{touch-action:none}
.ov{position:absolute;inset:0;z-index:3;pointer-events:none}
.ov > *{pointer-events:auto}
.ov-top{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:150px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;pointer-events:none}
.ov-top > *{pointer-events:auto}
.jobchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%;min-width:0;padding:8px 12px;border-radius:10px;border:0;background:var(--ticket);color:var(--ticket-ink);box-shadow:0 4px 14px rgba(0,0,0,.22);text-align:left;cursor:pointer}
.jc-title{font-family:var(--font-display);font-weight:800;font-size:19px;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.inv td.n.neg{color:var(--bad)}
.cz-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chips2{display:flex;flex-wrap:wrap;gap:6px}

/* Step bar, on-car nuts and pins, compact torque meter */

.auction,.haggle{display:grid;gap:12px}

.bth-meter{flex:none;display:grid;justify-items:end;line-height:1;min-width:58px}

.bth-meter small{margin-top:2px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.savecode{width:100%;box-sizing:border-box;min-height:118px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);font:500 12px/1.4 var(--font-mono);word-break:break-all;resize:vertical}
.booth-wrap{max-width:760px;margin:0 auto 16px}
.handback .btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.btn.big svg{width:20px;height:20px}
.auc-board{display:grid;justify-items:center;gap:4px;background:var(--hud-bg);color:var(--hud-fg);border-radius:14px;padding:12px}

.auc-lead{font-weight:700;font-size:15px}.auc-lead.you{color:var(--hazard)}
.auc-clock{width:100%;height:6px;border-radius:3px;background:var(--hud-track);overflow:hidden}.auc-clock i{display:block;height:100%;background:var(--hazard);transition:width .1s linear}

.auc-riv li.lead{box-shadow:inset 0 0 0 2px var(--hazard)}.auc-riv li.out{opacity:.45}
.auc-riv i,.hg-face{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c,var(--blue));color:#fff;display:grid;place-items:center;font:800 14px var(--font-display);font-style:normal}

.auc-log{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px;color:var(--muted)}.auc-log li:first-child{color:var(--ink);font-weight:600}

.auc-tip{font-size:13px}
.hg-buyer{display:flex;gap:12px;align-items:flex-start}.hg-face{width:46px;height:46px;font-size:20px;--c:var(--blue)}
.hg-buyer b{font-size:15px}.hg-say{margin:6px 0 0;font-size:16px;line-height:1.4}
.hg-pat{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}.hg-pat i{width:10px;height:10px;border-radius:50%;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line)}.hg-pat i.on{background:var(--bad);box-shadow:none}
.hg-offer{display:grid;justify-items:center;background:var(--panel-2);border-radius:14px;padding:10px}.hg-offer b{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:1}.hg-offer small{color:var(--muted)}

.cap-dial:active{cursor:grabbing}

.cap-top{stroke:rgba(0,0,0,.25);stroke-width:2}

.cap-steps{display:flex;gap:4px}.cap-steps i{width:18px;height:5px;border-radius:3px;background:var(--panel-2)}.cap-steps i.on{background:var(--hazard)}.cap-steps i.done{background:var(--good)}

.fw-read{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.holdbtn{touch-action:none;-webkit-user-select:none;user-select:none;min-height:46px}
.cap-hex{fill:#2C302E;stroke:rgba(255,255,255,.35);stroke-width:1.5}
.gapw,.airw{display:flex;gap:14px;align-items:center}
.gap-svg{flex:none;width:104px;height:104px;background:var(--panel-2);border-radius:14px}
.gp-shell{fill:#A8AFAC}.gp-thread path{stroke:#7E8683;stroke-width:2;fill:none}.gp-ins{fill:#EDEBE4;stroke:#C9C6BC}.gp-elec{fill:#8E9894}
.gp-strap{fill:none;stroke:#6F7773;stroke-width:9;stroke-linejoin:round}.gp-gap{stroke:#C8372D;stroke-width:1.6;stroke-dasharray:2 2}
.gp-blade{fill:var(--hazard);stroke:#B88A00;stroke-width:1}.gp-bl{font:800 9px var(--font-display);fill:#3A2E00}
.gap-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}.gap-acts .holdbtn{min-height:40px}
.air-g{flex:none;width:112px;height:108px}.ag-read{font:900 17px var(--font-display);fill:var(--ink)}
.ag-track{fill:none;stroke:var(--panel-2);stroke-width:9;stroke-linecap:round}.ag-ok{fill:none;stroke:var(--good);stroke-width:9}
.ag-tick{stroke:var(--muted);stroke-width:1.5}.ag-lab{font-size:8px;fill:var(--muted);font-weight:700}
.ag-needle{stroke:var(--bad);stroke-width:3;stroke-linecap:round}.ag-hub{fill:var(--ink)}.ag-unit{font-size:9px;font-weight:800;fill:var(--muted);letter-spacing:.08em}
.bolt.term.neg .hex{background:#1E2321}.bolt.term.pos .hex{background:#C8372D}
.bolt.term small{font-size:15px;font-weight:900}
.holdbtn.down{transform:scale(.97);filter:brightness(.92)}
.bl-car{position:relative;flex:none;width:96px;height:150px;border-radius:40px 40px 30px 30px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.bl-front{position:absolute;top:-2px;left:0;right:0;text-align:center;font:600 9px var(--font-mono);color:var(--muted);text-transform:uppercase}
.bl-w{position:absolute;width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font:700 12px var(--font-mono);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.bl-FL{left:-14px;top:22px}.bl-FR{right:-14px;top:22px}.bl-RL{left:-14px;bottom:18px}.bl-RR{right:-14px;bottom:18px}
.bl-w.done{background:var(--good);border-color:var(--good);color:var(--on-sem)}
.bl-w.bub{background:var(--hazard);animation:blub .7s ease-in-out}
@keyframes blub{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.95)}}

.bl-n{font-family:var(--font-mono);font-weight:600}
.capmark{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid var(--hazard);box-shadow:0 0 0 4px rgba(242,183,5,.25);animation:cappulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes cappulse{0%,100%{transform-origin:center;scale:1;opacity:1}50%{scale:1.18;opacity:.6}}

.bb-count{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;background:var(--hazard);color:var(--hazard-ink);border-radius:8px;padding:6px 9px;font-variant-numeric:tabular-nums}

.bb-act{display:flex;gap:6px;flex-wrap:wrap}
.tqbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}

.tq-track{position:absolute;left:0;right:0;top:9px;bottom:9px;border-radius:8px;background:var(--panel-2);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}

.tq-btn{min-height:52px;min-width:92px;font-size:17px}
.hot,.pins{position:absolute;inset:0;pointer-events:none;z-index:1}
.hot>*,.pins>*{pointer-events:auto}

.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.bad{background:var(--bad)} .dot.worn{background:var(--worn)} .dot.good{background:var(--good)}

/* Parts list */
.parts{background:var(--panel);border-radius:12px;overflow:hidden;scroll-margin-top:120px}

.plist{list-style:none;margin:0;padding:0}

.part:last-child{border-bottom:0}

.chip.new{background:var(--ink);color:var(--panel)}

.hint{font-size:13px;color:var(--muted);max-width:60ch}

.handback{background:var(--panel);border-radius:12px;padding:15px 16px;display:grid;gap:12px}
.hb-status b{display:block;font-size:16px}
.hb-status span{color:var(--muted);font-size:13.5px}

/* Page heads */
.ph{display:grid;gap:6px}
.ph h1{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.ph p{color:var(--muted);max-width:62ch}
.sh{font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1;margin-top:8px}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.board .ticket .btn{margin-top:4px}
.closeup{background:var(--panel);border-radius:12px;padding:15px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}

.build{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;letter-spacing:.06em}
/* the game drives touch scrolling itself (see the scroller in the script), so hosts that block the

html{touch-action:none}
.quiet{background:var(--panel);border-radius:12px;padding:22px 18px;color:var(--muted)}

.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}

.upg li{background:var(--panel);border-radius:12px;padding:15px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.upg li.owned{background:transparent;border:1.5px solid var(--line)}
.upg h3{font-size:17px;font-weight:700;line-height:1.2}
.upg p{color:var(--muted);font-size:14px;max-width:58ch}
.upg .btn{min-height:42px;white-space:nowrap}

.ownedtag{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.garage-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}

.sheet-title{font-family:var(--font-display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;margin-top:3px;text-wrap:balance}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stamp{flex:0 0 auto;font-family:var(--font-display);font-weight:900;font-size:24px;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:6px;padding:2px 10px;transform:rotate(-8deg);margin-top:6px}
.stamp.part{color:var(--worn);border-color:var(--worn)}

.inv tr.profit td{font-weight:700;border-bottom:0}
.neg{color:var(--bad)} .pos{color:var(--good)}

.feedback cite{display:block;margin-top:4px;font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}

.deltas b{color:var(--ink);font-family:var(--font-mono)}
.deltas b.neg{color:var(--bad)} .deltas b.pos{color:var(--good)}

.warnline{color:var(--worn);font-weight:600}
.badline{color:var(--bad);font-weight:700}

/* Busy + toast */
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:min(300px,calc(100% - 32px));background:var(--hud-bg);color:var(--hud-fg);border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}

.busy-time{font-family:var(--font-mono);color:var(--hazard);white-space:nowrap}

  .ov-card{max-height:calc(100% - 20px)}

  { id: 'brakepull', lvl: 2, diff: 2, base: 70, title: 'Pulls under braking', text: 'It pulls hard to one side whenever I brake.', gen() { const c = frontSide(); const f = ['bhose_' + c]; if (chance(.4)) f.push('pads_' + c); return f; } },

  /* ---- level 3 ---- */
  { id: 'emissions', lvl: 3, diff: 3, base: 110, title: 'Engine light on', text: 'Engine light’s on and it’s drinking fuel. The place down the road couldn’t find it.', gen() { const f = []; if (chance(.5)) f.push('lambda'); if (chance(.35)) f.push('cat'); if (chance(.3)) f.push('fuelfilter'); if (chance(.35) || !f.length) f.push('airfilter'); return f; } },

  { id: 'clutch', lvl: 3, diff: 3, base: 220, title: 'Clutch slipping', text: 'Revs climb but it doesn’t pick up, especially in fourth. The biting point’s right at the top.', gen: () => ['clutch'] },

  { id: 'eggs', lvl: 3, diff: 3, base: 140, title: 'Rotten-egg smell', text: 'Car stinks of rotten eggs and won’t do more than 50 up hills.', gen() { const f = ['cat']; if (chance(.4)) f.push('lambda'); return f; } },
  { id: 'thirsty', lvl: 3, diff: 3, base: 120, title: 'Thirsty and smelly', text: 'I’m getting 30 mpg instead of 45 and it smells of petrol.', gen() { const f = ['injectors']; if (chance(.3)) f.push('lambda'); return f; } },

  { id: 'pullaway', lvl: 3, diff: 2, base: 100, title: 'Clunk pulling away', text: 'Big clunk when I pull away or change gear.', gen() { const f = ['mount']; if (chance(.35)) f.push('drive_' + frontSide()); return f; } },

  { id: 'mwayhot', lvl: 3, diff: 3, base: 130, title: 'Hot on the motorway', text: 'It overheats on the motorway but it’s fine around town.', gen() { const f = ['radiator']; if (chance(.5)) f.push('waterpump'); return f; } },

  { id: 'privatehire', lvl: 4, diff: 4, base: 180, title: 'Private hire rattles', text: 'It’s a private hire car. It rattles and knocks everywhere and the passengers are complaining.', gen: () => sample(['droplink_FL', 'droplink_FR', 'heatshield', 'tierod_FL', 'balljoint_FR', 'shock_RL', 'mount', 'silencer'], 3) },
  { id: 'flood', lvl: 4, diff: 4, base: 190, title: 'Drove through a flood', text: 'I drove through a flood. Now it runs rough and the ABS light’s on.', gen() { const f = ['coils', 'abs_' + anyCorner()]; if (chance(.4)) f.push('starter'); return f; } },

  { id: 'cooling', lvl: 4, diff: 4, base: 200, title: 'Cooling system overhaul', text: 'Overheated twice this month and it’s already had a new thermostat.', gen: () => sample(['radiator', 'waterpump', 'hose', 'exptank'], chance(.5) ? 3 : 2) },
  { id: 'smoky', lvl: 4, diff: 4, base: 210, title: 'Smoky and thirsty', text: 'Thirsty, smoky, and the engine light keeps flashing.', gen: () => sample(['coils', 'plugs', 'injectors', 'lambda'], 3) },

  { id: 'starting', lvl: 4, diff: 4, base: 200, title: 'Starting and charging', text: 'Sometimes it won’t start, the battery light flickers and the starter whines.', gen() { const f = sample(['battery', 'alternator', 'starter'], chance(.5) ? 3 : 2); if (chance(.4)) f.push('belt'); return f; } },

  { id: 'noisywheels', lvl: 4, diff: 4, base: 190, title: 'Noisy wheels', text: 'There’s grinding and humming from more than one wheel.', gen() { const f = sample(ALL_BEARINGS, 2); if (chance(.3)) f.push('pads_' + anyCorner()); return f; } },
  { id: 'pothole', lvl: 4, diff: 4, base: 190, title: 'Pothole damage', text: 'Hit a pothole you could lose a dog in. The front left took the hit.', gen: () => sample(['wheel_FL', 'balljoint_FL', 'tierod_FL', 'droplink_FL', 'shock_FL', 'spring_FL'], 3) },

  { id: 'opinion', lvl: 5, diff: 5, base: 220, title: 'Second opinion', text: 'Another garage quoted me £2,000. I want a second opinion, and only what it really needs.', gen: () => sample(ALL_FAULTY, chance(.5) ? 3 : 2) },

/* Touch and mouse: one finger turns, two fingers pinch to zoom and drag to move.

    if (e.isPrimary !== false && pts.size) { pts.clear(); mode = null; }

    const sig = ['neon', 'lights', 'plants', 'floor', 'walls', 'trophy', 'arcade', 'lounge', 'ads', 'tyremc', 'heater', 'diag', 'torque', 'stock'].map(lv).join('') + ':' + cups + ':' + (S.garageCat ? 1 : 0) + (S.prizes || []).join(',');

    DEC.neon.visible = lv('neon') > 0; DEC.panels.visible = lv('lights') > 0; DEC.plants.visible = lv('plants') > 0;
    renderer.toneMappingExposure = lv('lights') ? 1.12 : 1.0; M.light.color.copy(col(lv('lights') ? '#F4FAFF' : '#FFF8E1'));
    const f = lv('floor'); M.floor.map = f >= 2 ? DEC.chequerTex : f ? DEC.epoxyTex : DEC.floorTex; M.floor.roughness = f >= 2 ? 0.3 : f ? 0.2 : 0.4; M.floor.needsUpdate = true;

    DEC.cat.visible = !!S.garageCat; DEC.prize.visible = (S.prizes || []).includes('rally');

  const SKIN = ['#F1C9A5', '#E0AC85', '#C68863', '#9C6644', '#6F4630', '#F5D7BD'];
  const TOPS = ['#2D6CDF', '#C8372D', '#2E8B57', '#E07A1F', '#6B5B45', '#4A5560', '#B4489A', '#1F3A93', '#D9D3C7', '#2A2E2C', '#7FA33A', '#9C1C2E'];

  }

      PG.head = new T.SphereGeometry(0.105, 16, 12); PG.hair = new T.SphereGeometry(0.112, 16, 8, 0, 2 * PI, 0, PI * 0.5); PG.neck = new T.CylinderGeometry(0.04, 0.045, 0.1, 8);

const b64Of = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const bytesOf = t => { const b = atob(t), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function makeSaveCode() {
  const raw = JSON.stringify(S);
  try {
    if (window.CompressionStream) {
      const z = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'BONNETUP2:' + b64Of(new Uint8Array(await new Response(z).arrayBuffer()));
    }
  } catch (e) { /* fall back to plain text */ }
  return 'BONNETUP1:' + b64Of(new TextEncoder().encode(raw));
}
async function readSaveCode(code) {
  const m = /^BONNETUP([12]):([A-Za-z0-9+/=]+)$/.exec(String(code || '').replace(/\s+/g, ''));
  if (!m) throw new Error('That doesn’t look like a Bonnet Up save code. Copy the whole thing, starting with BONNETUP.');
  let bytes;
  try { bytes = bytesOf(m[2]); } catch (e) { throw new Error('Part of the code is missing. Copy it again, all of it.'); }
  if (m[1] === '2') {
    if (!window.DecompressionStream) throw new Error('This browser is too old to open that code. Update it, or copy the code from an older copy of the game.');
    try { const z = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes = new Uint8Array(await new Response(z).arrayBuffer()); }
    catch (e) { throw new Error('Part of the code is missing. Copy it again, all of it.'); }
  }
  let o; try { o = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { throw new Error('Part of the code is missing. Copy it again, all of it.'); }
  if (!o || o.v !== 1 || !Array.isArray(o.bays) || !Array.isArray(o.board)) throw new Error('That code isn’t a Bonnet Up garage.');
  return o;
}

async function saveLoad() {
  const ta = document.getElementById('save-in'), err = document.getElementById('save-err'); if (!ta) return;
  const say = t => { if (err) { err.textContent = t; err.hidden = false; } Sfx.bad(); };
  let o;
  try { o = await readSaveCode(ta.value); } catch (e) { say(e.message); return; }
  /* keep the old garage until the new one is known to load */
  let old = null; try { old = localStorage.getItem(SAVE_KEY); } catch (e) { /* storage unavailable */ }
  let S2 = null;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); S2 = load(); } catch (e) { S2 = null; }
  if (!S2) { try { if (old != null) localStorage.setItem(SAVE_KEY, old); } catch (e) { /* storage unavailable */ } say('That code is from a different version of the game, or it’s broken.'); return; }
  if (BT) boothAbort(true);
  if (AUC) { clearInterval(AUC.timer); AUC = null; }
  HAG = null; UI.sel = null; UI.bolt = null; UI.drawer = null; UI.stepKey = null;
  S = S2; ensureState(); save();
  closeModal(); render();
  Sfx.cash(); toast(`Garage loaded: day ${S.day}, ${money(S.money)} in the bank.`);
}

  const ae = document.activeElement;
  const key = ae && ae.dataset && ae.dataset.a ? ae.dataset.a + '|' + (ae.dataset.id || ae.dataset.z || ae.dataset.v || '') : null;
  renderHud();
  sizeStage(); wasLand = isLandscape();
  ['workshop', 'jobs', 'garage'].forEach(v => {
    $('#view-' + v).hidden = S.view !== v;
    const t = $('#tab-' + v); if (S.view === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  document.body.classList.toggle('immersive', S.view === 'workshop' && Car3D.ok);
  if (S.view === 'workshop') renderWorkshop(); else if (S.view === 'jobs') renderJobs(); else renderGarage();
  renderDrawer();
  save();
  if (key) {
    const [ka, kid] = key.split('|');
    const el = [...document.querySelectorAll(`[data-a="${ka}"]`)].find(e => (e.dataset.id || e.dataset.z || e.dataset.v || '') === kid);
    if (el && el.focus && el !== document.activeElement && !el.disabled) el.focus({ preventScroll: true });
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const m = $('#modal');
  if (e.target === m && modalClosable) { closeModal(); return; }
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (busy) return;
  if (S.over && !['restart', 'sound', 'turn'].includes(a)) return;
  switch (a) {
    case 'tab': S.view = b.dataset.v; UI.drawer = null; render(); toTop(); break;
    case 'zone': {
      const j = cur(); if (!j) break; const z = b.dataset.z;
      if (Car3D.ok) { UI.sel = null; UI.bolt = null; j.zone = z; if (z === 'under') raiseForUnder(j); render(); Car3D.focus(z); break; }
      if (j.zone === z) break;
      j.zone = z; render();
      if (b.tagName.toLowerCase() === 'rect') { const p = $('#parts'); if (p) p.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); }
      break;
    }
    case 'view-all': if (Car3D.ok) Car3D.overview(); break;
    case 'door': if (Car3D.ok) Car3D.toggleDoor(); break;
    case 'nav-compass': if (Car3D.ok) Car3D.heading(); break;
    case 'nav-in': if (Car3D.ok) Car3D.zoom(0.72); break;
    case 'nav-out': if (Car3D.ok) Car3D.zoom(1.38); break;
    case 'nav-xray': if (Car3D.ok) Car3D.toggleXray(); break;
    case 'sel': selectPart(id, !!b.dataset.f || b.classList.contains('pc-chip')); break;
    case 'card-close': UI.sel = null; UI.bolt = null; render(); break;
    case 'c-inspect': if (UI.sel) inspect(UI.sel); break;
    case 'c-remove': startBolts('remove'); break;
    case 'c-refit': startBolts('refit'); break;
    case 'c-new': if (UI.sel) openShop(UI.sel, false); break;
    case 'c-stock': startBolts('stock'); break;
    case 'c-upg': if (UI.sel) openShop(UI.sel, true); break;
    case 'g-drive': guidedDrive(); break;
    case 'g-ans': answerQuiz(id); break;
    case 'g-lift': doLift(Number(b.dataset.v)); break;
    case 'tn-run': dynoRun(); break;
    case 'g-modbuy': modBuy(); break;
    case 'flatmodbuy': { const j = cur(); if (j && !(j.modStock || {})[id]) { const c = modList(j, id); if (S.money - c >= OVERDRAFT) { S.money -= c; j.spent += c; S.stats.spent += c; j.modStock = j.modStock || {}; j.modStock[id] = true; j.modPaid = j.modPaid || {}; j.modPaid[id] = c; Sfx.cash(); render(); } } break; }
    case 'flatmodfit': doModFit('mod:' + id); break;
    case 'custom': if (BT) break; renderCustom(); break;
    case 'cz': customBuy(b.dataset.k, b.dataset.v); break;
    case 'tn-hint': tuneHint(); break;
    case 'tn-save': tuneSave(); break;
    case 'g-shop': { const j = cur(), st = j && nextStep(j); if (st && st.kind === 'order') openShop(st.id, st.up); break; }
    case 'shop-pick': shopPick(Number(b.dataset.i)); break;
    case 'shop-close': UI.shop = null; closeModal(); break;
    case 'bonus-yes': { const j = cur(); if (j && id && j.parts[id]) { j.targets.push(id); j.parts[id].known = true; Sfx.good(); toast(`Added the ${lc(partLabel(id))} to the job.`); } closeModal(); render(); break; }
    case 'bolt': boltTap(Number(b.dataset.i)); break;
    case 'gap': gapBend(Number(b.dataset.v)); break;
    case 'gap-check': gapCheck(); break;
    case 'bolt-all': if (UI.bolt && UI.bolt.phase === 'bolts') { Sfx.impact(); buzz([30, 20, 30]); UI.bolt.done = UI.bolt.done.map(() => true); UI.bolt.seized = []; boltsDone(); } break;
    case 'oil': if (UI.bolt && UI.bolt.seized.length) { Sfx.pop(); work(3, 'Soaking the bolts in penetrating oil', () => { if (UI.bolt) UI.bolt.seized = []; }); } break;
    case 'torque': torqueHit(); break;
    case 'goals': showGoals(); break;
    case 'sound': Sfx.toggle(); renderHud(); break;
    case 'turn': if (SHELL) { const r = SHELL.turn(); try { localStorage.setItem(TURN_TIP, '1'); } catch (e) {} toast(r ? 'Turned round. Wrong way up? Tap it again.' : 'Back to normal.'); } break;
    case 'buylot': buyLot(Number(id)); break;
    case 'auction': startAuction(Number(id)); break;
    case 'booth-go': { const j = cur(); if (j && j.respray && !j.respray.done && assembled(j) && !BT) startRespray(j); break; }
    case 'booth-next': if (BT && !BT.locked && !BT.wait) { const tl = BOOTH_TOOLS[BT.stage]; if (BT.stage === 'mask' || (tl && tl.want && boothProgress() >= tl.min)) { BT.locked = true; boothNext(); } } break;
    case 'booth-peel-all': if (BT && BT.stage === 'peel' && !BT.locked) { BT.masked[BT.side].forEach(i2 => { const pc = boothPiece(i2); if (pc) BT.peels.push(Object.assign(pc, { t0: performance.now() })); }); BT.masked[BT.side].clear(); boothPaper(); Sfx.peel(); BT.locked = true; setTimeout(() => { if (BT) boothNext(); }, 500); } break;
    case 'booth-quit': showModal('<div><span class="label">Paint booth</span><h2 class="sheet-title">Stop now?</h2><p class="muted">You’ll lose what you’ve done in the booth, and the car goes back how it was.</p></div><div class="row"><button class="btn primary" data-a="close-modal">Keep going</button><button class="btn" data-a="booth-quit-yes">Stop</button></div>'); break;
    case 'booth-quit-yes': closeModal(); boothAbort(); break;
    case 'wash': { const j = cur(); if (j && !BT && assembled(j)) startWash(j); break; }
    case 'auc-bid': if (AUC && !AUC.done && AUC.leader !== 'you' && S.money >= aucNext()) aucBid('you'); break;
    case 'auc-walk': aucWalk(false); break;
    case 'auc-close': AUC = null; closeModal(); render(); break;
    case 'confirm-sell': sellProject(); break;
    case 'haggle': startHaggle(); break;
    case 'hg-accept': if (HAG && HAG.buyer && !HAG.gone) { Sfx.cash(); hagDeal(HAG.buyer.offer, 'Lovely. Pleasure doing business.'); } break;
    case 'hg-ask': hagAsk(Number(b.dataset.v)); break;
    case 'hg-next': hagNext(); break;
    case 'hg-trade': if (HAG) { const H = HAG; HAG = null; sellProject(r10(H.v * 0.78), H); } break;
    case 'hg-keep': HAG = null; closeModal(); render(); break;
    case 'bolt-cancel': if (UI.bolt && UI.bolt.cap) c3('setCap', UI.bolt.id, null); if (AIR.hold) airRelease(); Sfx.loopStop(); UI.bolt = null; render(); break;
    case 'cap-tap': if (performance.now() - CAPIN.last > 350 && UI.bolt && UI.bolt.cap) capTwist((TWISTS[UI.bolt.phase] || 1) * Math.PI / 4); break;
    case 'bleed': bleedTap(b.dataset.c); break;
    case 'cat-tap': { const j = cur(); if (!j || !j.cat || j.catOut) break; j.catTaps = (j.catTaps || 0) + 1; Sfx.meow(); buzz(10);
      if (j.catTaps >= 3) { j.catOut = true; j.stepsDone = (j.stepsDone || 0) + 1; toast('She hops out, stretches, and curls up on your tool chest. Now, that squeak…'); }
      render(); break; }
    case 'drawer': UI.drawer = b.dataset.v || 'job'; render(); break;
    case 'drawer-close': UI.drawer = null; render(); break;
    case 'dz': UI.dzone = b.dataset.z; render(); break;
    case 'fitupg': fitUpgrade(id); break;
    case 'bay': if (BT) { toast('Finish up in the paint booth first.'); break; } S.activeBay = Number(id); UI.sel = null; UI.bolt = null; render(); break;
    case 'inspect': inspect(id); break;
    case 'remove': removePart(id); break;
    case 'refit': refit(id, false); break;
    case 'fitnew': refit(id, true); break;
    case 'drive': drive(); break;
    case 'scan': scan(); break;
    case 'meter': meter(); break;
    case 'pressure': pressure(); break;
    case 'locked': goGarage(); break;
    case 'accept': acceptJob(Number(id)); break;
    case 'buy': buy(id); break;
    case 'handback': handBack(); break;
    case 'abandon': askAbandon(); break;
    case 'confirm-abandon': closeModal(); abandon(); break;
    case 'closeday': askCloseDay(); break;
    case 'confirm-closeday': closeModal(); endDay(); break;
    case 'close-modal': closeModal(); break;
    case 'dismiss-intro': S.seenIntro = true; render(); break;
    case 'intro': S.seenIntro = false; S.view = 'workshop'; render(); toTop(); break;
    case 'reset': askReset(); break;
    case 'savemove': showSaveMove(); break;
    case 'save-copy': saveCopy(); break;
    case 'save-paste': savePaste(); break;
    case 'save-load': saveLoad(); break;
    case 'confirm-reset': case 'restart': closeModal(); newGame(); break;
  }
});
document.addEventListener('input', e => { const el = e.target; if (el && el.dataset && el.dataset.tune) tuneInput(el); });
document.addEventListener('change', e => { const el = e.target; if (el && el.dataset && el.dataset.tune) save(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) { if (modalClosable) closeModal(); return; }
  if (UI.bolt) { UI.bolt = null; render(); } else if (UI.drawer) { UI.drawer = null; render(); } else if (UI.sel) { UI.sel = null; render(); }
});

/* ---------- touch scrolling ----------
   Every list, card and sheet scrolls by finger here, with a little momentum. The game handles the finger
   itself (touch events, cancelling the browser's own pan) because some hosts break the browser's scrolling
   inside the game frame: itch.io's phone full-screen mode, and the turned-round view. */
(() => {
  const SLOP = 8;
  let d = null, fling = 0, lastDrag = 0;
  const canScroll = (el, axis, dir) => {
    const cs = getComputedStyle(el), ov = axis === 'y' ? cs.overflowY : cs.overflowX;
    if (ov !== 'auto' && ov !== 'scroll') return false;
    if (axis === 'y') { const max = el.scrollHeight - el.clientHeight; return max > 1 && (dir > 0 ? el.scrollTop < max - 1 : el.scrollTop > 0); }
    const max = el.scrollWidth - el.clientWidth; return max > 1 && (dir > 0 ? el.scrollLeft < max - 1 : el.scrollLeft > 0);
  };
  const findScroller = (start, axis, dir) => { for (let el = start; el && el !== document.documentElement; el = el.parentElement) if (canScroll(el, axis, dir)) return el; return null; };
  const stopFling = () => { if (fling) cancelAnimationFrame(fling); fling = 0; };
  const touchOf = (e, id) => { for (const t of e.changedTouches) if (t.identifier === id) return t; return null; };
  document.addEventListener('touchstart', e => {
    stopFling();
    if (e.touches.length !== 1) { d = null; return; }
    const t = e.changedTouches[0], el = e.target;
    if (!el || !el.closest || el.closest('canvas, input, select, textarea, .lift, [data-noscroll]')) { d = null; return; }
    d = { id: t.identifier, x: t.clientX, y: t.clientY, from: el, el: null, axis: null, samples: [] };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!d) return;
    if (e.touches.length !== 1) { d = null; return; }
    const t = touchOf(e, d.id); if (!t) return;
    const dx = t.clientX - d.x, dy = t.clientY - d.y;
    if (!d.el) {
      if (Math.abs(dx) < SLOP && Math.abs(dy) < SLOP) return;
      d.axis = Math.abs(dy) >= Math.abs(dx) ? 'y' : 'x';
      const dir = d.axis === 'y' ? -Math.sign(dy) : -Math.sign(dx);
      d.el = findScroller(d.from, d.axis, dir);
      if (!d.el) { d = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    const delta = d.axis === 'y' ? t.clientY - d.y : t.clientX - d.x;
    if (d.axis === 'y') d.el.scrollTop -= delta; else d.el.scrollLeft -= delta;
    d.x = t.clientX; d.y = t.clientY;
    const now = performance.now(); d.samples.push([now, delta]);
    while (d.samples.length > 1 && now - d.samples[0][0] > 100) d.samples.shift();
  }, { passive: false });
  const end = e => {
    if (!d) return;
    if (!touchOf(e, d.id)) return;
    const g = d; d = null;
    if (!g.el) return;
    lastDrag = performance.now();
    if (e.type === 'touchcancel' || !g.samples.length) return;
    const span = performance.now() - g.samples[0][0];
    let v = span < 160 ? g.samples.reduce((n, x) => n + x[1], 0) / Math.max(16, span) : 0;
    v = Math.max(-4, Math.min(4, v));
    if (Math.abs(v) < 0.08 || reduced) return;
    let last = performance.now();
    const step = now => {
      const dt = Math.min(32, now - last); last = now;
      if (g.axis === 'y') g.el.scrollTop -= v * dt; else g.el.scrollLeft -= v * dt;
      v *= Math.pow(0.95, dt / 16);
      fling = Math.abs(v) > 0.03 ? requestAnimationFrame(step) : 0;
    };
    fling = requestAnimationFrame(step);
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
  /* a finger that scrolled the list isn't a tap on whatever it started on */
  document.addEventListener('click', e => { if (performance.now() - lastDrag < 350) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ---------- boot ---------- */
const BUILD = 17;
/* On itch.io phones the page is locked to one way round. The itch build wraps the game in a small
   shell page that can turn it a quarter turn, so players can hold the phone either way. */
const SHELL = (() => { try { return window.parent !== window && window.parent.BonnetShell ? window.parent.BonnetShell : null; } catch (e) { return null; } })();
const TURN_TIP = 'bonnet-up.turn-tip';
(() => {
  const b = $('#h-turn'); if (!b) return;
  const touch = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
  b.hidden = !(SHELL && touch); b.innerHTML = ICON.turn;
  if (b.hidden) return;
  let seen = false; try { seen = !!localStorage.getItem(TURN_TIP); } catch (e) {}
  if (!seen) setTimeout(() => toast('Tip: tap the turn button at the top to play the other way round.'), 1600);
})();
function start(data) {
  const snap = data && data.S;
  S = snap || load();
  if (!S) { newGame(); return; }
  ensureState();
  render();
  if (S.over) showDaySummary({ day: S.day - 1, jobs: 0, earned: 0, rent: rentNow() });
}
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
