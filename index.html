<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bonnet Up</title>
<meta name="theme-color" content="#1D2521">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bonnet Up">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Bonnet Up: a 3D car mechanic game. Diagnose faults, undo the nuts, fit the right parts and hand the car back.">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1E2320;touch-action:none}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;border:0;display:block;transform-origin:0 0;background:#1E2320;touch-action:none}
#install{position:fixed;z-index:5;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;max-width:calc(100vw - 32px);padding:6px 6px 6px 16px;border-radius:999px;background:#F2B705;color:#15130B;font:700 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#install[hidden]{display:none}
#install button{border:0;border-radius:999px;font:inherit;cursor:pointer}
#install .go{padding:9px 14px;background:#15130B;color:#F2B705}
#install .x{width:34px;height:34px;background:transparent;color:#15130B;font-size:20px;line-height:1}
</style>
<script>
/* itch.io locks phones to one way round. This page holds the game and can give it a quarter turn,
   so it reads the right way up however the phone is held. The game calls BonnetShell.turn(). */
window.BonnetShell = (() => {
  const KEY = 'bonnet-up.turn';
  let rot = 0;
  const angle = () => {
    try { if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle; } catch (e) {}
    return typeof window.orientation === 'number' ? (window.orientation + 360) % 360 : 0;
  };
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };
  const write = () => { try { localStorage.setItem(KEY, JSON.stringify({ a: angle(), r: rot })); } catch (e) {} };
  function layout() {
    const f = document.getElementById('game'); if (!f) return;
    const W = window.innerWidth, H = window.innerHeight;
    if (rot) {
      f.style.width = H + 'px'; f.style.height = W + 'px';
      f.style.transform = rot > 0 ? `translate(${W}px,0) rotate(90deg)` : `translate(0,${H}px) rotate(-90deg)`;
    } else {
      f.style.width = W + 'px'; f.style.height = H + 'px'; f.style.transform = 'none';
    }
  }
  /* a saved turn only applies while the screen is locked the same way as when it was chosen */
  function restore() { const s = read(); rot = s && s.a === angle() && (s.r === 90 || s.r === -90) ? s.r : 0; layout(); }
  /* first tap: the quarter turn that suits how the screen is locked; second: the other way; third: back to normal */
  function turn() {
    const a = angle(), wide = window.innerWidth > window.innerHeight;
    const first = wide ? (a === 270 ? 90 : -90) : (a === 180 ? -90 : 90);
    rot = rot === 0 ? first : rot === first ? -first : 0;
    write(); layout();
    return rot;
  }
  window.addEventListener('resize', layout);
  try { screen.orientation.addEventListener('change', restore); } catch (e) { window.addEventListener('orientationchange', restore); }
  return { turn, restore, layout, get rot() { return rot; } };
})();
</script>
</head>
<body>
<iframe id="game" src="game.html" title="Bonnet Up" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; clipboard-write; clipboard-read"></iframe>
<div id="install" role="dialog" aria-label="Install Bonnet Up" hidden><span id="install-text">Play it as an app</span><button class="go" id="install-go">Install</button><button class="x" id="install-x" aria-label="Not now">×</button></div>
<script>BonnetShell.restore();</script>
<script>
/* offline play: the service worker keeps a copy of the game */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
/* a small offer to install, only in the browser, at most once a week */
(() => {
  const box = document.getElementById('install'), go = document.getElementById('install-go'), x = document.getElementById('install-x'), txt = document.getElementById('install-text');
  const KEY = 'bonnet-up.install-later';
  const app = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true || document.referrer.startsWith('android-app://');
  const later = () => { try { return Date.now() - Number(localStorage.getItem(KEY) || 0) < 7 * 864e5; } catch (e) { return false; } };
  const hide = remember => { box.hidden = true; if (remember) try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} };
  let ask = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); ask = e;
    if (!app() && !later()) setTimeout(() => { box.hidden = false; setTimeout(() => hide(false), 15000); }, 4000);
  });
  go.addEventListener('click', async () => {
    if (!ask) { hide(true); return; }
    ask.prompt(); try { await ask.userChoice; } catch (e) {}
    ask = null; hide(true);
  });
  x.addEventListener('click', () => hide(true));
  window.addEventListener('appinstalled', () => hide(true));
  /* iPhone and iPad have no install button: point at Share, then Add to Home Screen */
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !app() && !later()) {
    txt.textContent = 'Tap Share, then Add to Home Screen';
    go.hidden = true;
    setTimeout(() => { box.hidden = false; setTimeout(() => hide(false), 12000); }, 4000);
  }
})();
</script>
</body>
</html>
